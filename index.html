<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SCOREDASH</title>

  <style>
    :root {
      --bg: #080b0f;
      --panel: #10151b;
      --panel-2: #151b22;
      --border: #242c35;
      --text: #f4f7fa;
      --muted: #8f9aa6;
      --accent: #c9ff4a;
      --danger: #ff5d6c;
      --warning: #ffc857;
      --blue: #5ba7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 50px;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand b {
      color: var(--accent);
    }

    .tagline {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* SEARCH */

    .search-wrap {
      position: relative;
      width: 300px;
    }

    .search {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 12px 14px;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
    }

    .search-results {
      display: none;
      position: absolute;
      top: calc(100% + 7px);
      left: 0;
      right: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
    }

    .search-result {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }

    .search-result:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .search-result img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .search-result-name {
      font-size: 13px;
      font-weight: 700;
    }

    .search-result-country {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    /* LEAGUE SELECTOR */

    .league-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .league-selector label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .league-select {
      min-width: 270px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 13px;
      outline: none;
      cursor: pointer;
    }

    .league-select:focus {
      border-color: var(--accent);
    }

    /* MAIN GRID */

    .page-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 18px;
      align-items: start;
    }

    .left-column,
    .right-column {
      min-width: 0;
    }

    /* CARDS */

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .card-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
    }

    .card-count {
      color: var(--muted);
      font-size: 11px;
    }

    .card-body {
      padding: 0;
    }

    .loading,
    .empty,
    .error {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .error {
      color: var(--danger);
    }

    /* MATCH ROWS */

    .match-row {
      width: 100%;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 72px;
      gap: 12px;
      align-items: center;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      padding: 13px 16px;
      text-align: left;
      cursor: pointer;
    }

    .match-row:last-child {
      border-bottom: 0;
    }

    .match-row:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .match-meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .match-date {
      font-weight: 700;
      color: var(--text);
    }

    .match-teams {
      min-width: 0;
    }

    .team-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin: 3px 0;
    }

    .team-line img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex: 0 0 22px;
    }

    .team-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 700;
    }

    .match-score {
      text-align: right;
      font-weight: 900;
      line-height: 1.8;
    }

    .match-status {
      display: inline-block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .status-live {
      color: var(--accent);
    }

    .status-finished {
      color: var(--muted);
    }

    /* STANDINGS */

    .standings-wrap {
      padding: 0 10px 4px;
    }

    /*
      The table is deliberately compact enough to fit the right panel.
      There is NO horizontal scrolling.
    */

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .standings-table th {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 800;
      text-align: center;
      padding: 10px 2px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .standings-table th:nth-child(2) {
      text-align: left;
    }

    .standings-table td {
      padding: 8px 2px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
    }

    .standings-table tr:last-child td {
      border-bottom: 0;
    }

    .standings-table th:nth-child(1),
    .standings-table td:nth-child(1) {
      width: 24px;
    }

    .standings-table th:nth-child(2),
    .standings-table td:nth-child(2) {
      width: auto;
    }

    .standings-table th:nth-child(n+3),
    .standings-table td:nth-child(n+3) {
      width: 30px;
    }

    .standing-team {
      display: flex;
      align-items: center;
      gap: 6px;
      text-align: left;
      min-width: 0;
    }

    .standing-team img {
      width: 21px;
      height: 21px;
      object-fit: contain;
      flex: 0 0 21px;
    }

    .standing-name {
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .standing-position {
      color: var(--muted);
      font-size: 10px;
    }

    .points {
      font-weight: 900;
      color: var(--accent);
    }

    .standings-extra {
      display: none;
    }

    .standings-extra.expanded {
      display: table-row;
    }

    .table-footer {
      border-top: 1px solid var(--border);
      padding: 9px 10px;
      text-align: center;
    }

    .table-toggle {
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* TOP SCORERS */

    .scorer-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 45px;
      gap: 10px;
      align-items: center;
      padding: 11px 15px;
      border-bottom: 1px solid var(--border);
    }

    .scorer-row:last-child {
      border-bottom: 0;
    }

    .scorer-number {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .scorer-info {
      min-width: 0;
    }

    .scorer-name {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scorer-team {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .scorer-goals {
      text-align: right;
      font-size: 16px;
      font-weight: 900;
      color: var(--accent);
    }

    /* MODAL */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 1000;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(620px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 900;
    }

    .modal-close {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
    }

    .modal-match {
      padding: 25px 20px;
      text-align: center;
    }

    .modal-teams {
      display: grid;
      grid-template-columns: 1fr 100px 1fr;
      align-items: center;
      gap: 12px;
    }

    .modal-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .modal-team img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .modal-team-name {
      font-size: 13px;
      font-weight: 800;
    }

    .modal-score {
      font-size: 28px;
      font-weight: 900;
    }

    .modal-status {
      color: var(--muted);
      font-size: 11px;
      margin-top: 6px;
    }

    .events {
      border-top: 1px solid var(--border);
    }

    .event-row {
      display: grid;
      grid-template-columns: 50px 1fr 1fr;
      gap: 10px;
      padding: 10px 15px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .event-time {
      color: var(--accent);
      font-weight: 800;
    }

    .event-home,
    .event-away {
      color: var(--text);
    }

    .event-away {
      text-align: right;
    }

    /* FOOTER */

    .footer {
      margin-top: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    /* RESPONSIVE */

    @media (max-width: 1100px) {
      .page-grid {
        grid-template-columns: minmax(0, 1fr) 390px;
      }

      .search-wrap {
        width: 240px;
      }
    }

    @media (max-width: 850px) {
      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .header-right {
        width: 100%;
      }

      .search-wrap {
        width: 100%;
      }

      .page-grid {
        grid-template-columns: 1fr;
      }

      .right-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        align-items: start;
      }

      .right-column .card {
        margin-bottom: 0;
      }
    }

    @media (max-width: 650px) {
      .app {
        width: min(100% - 20px, 1500px);
        padding-top: 15px;
      }

      .league-selector {
        align-items: stretch;
        flex-direction: column;
      }

      .league-select {
        width: 100%;
      }

      .match-row {
        grid-template-columns: 65px minmax(0, 1fr) 48px;
        gap: 7px;
        padding: 11px 10px;
      }

      .match-meta {
        font-size: 9px;
      }

      .team-name {
        font-size: 11px;
      }

      .right-column {
        grid-template-columns: 1fr;
      }

      .right-column .card {
        margin-bottom: 18px;
      }

      .standings-table th,
      .standings-table td {
        font-size: 9px;
      }

      .standings-table th:nth-child(n+3),
      .standings-table td:nth-child(n+3) {
        width: 27px;
      }

      .standing-team img {
        width: 19px;
        height: 19px;
        flex-basis: 19px;
      }

      .modal-teams {
        grid-template-columns: 1fr 70px 1fr;
      }

      .modal-team img {
        width: 45px;
        height: 45px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <div>
        <div class="brand">SCORE<b>DASH</b></div>
        <div class="tagline">Football scores & fixtures</div>
      </div>

      <div class="header-right">

        <div class="search-wrap">
          <input
            id="teamSearch"
            class="search"
            type="text"
            autocomplete="off"
            placeholder="Search for a team..."
          />

          <div id="searchResults" class="search-results"></div>
        </div>

      </div>

    </header>


    <!-- LEAGUE SELECTOR -->
    <div class="league-selector">

      <label for="leagueSelect">League</label>

      <select id="leagueSelect" class="league-select">
        <option value="premier">Premier League</option>
        <option value="laliga">LaLiga</option>
        <option value="seriea">Serie A</option>
        <option value="bundesliga">Bundesliga</option>
        <option value="ligue1">Ligue 1</option>
      </select>

    </div>


    <!-- MAIN -->
    <main class="page-grid">

      <!-- LEFT -->
      <section class="left-column">

        <!-- LIVE -->
        <div class="card">

          <div class="card-header">
            <div class="card-title">Live matches</div>
            <div id="liveCount" class="card-count">0</div>
          </div>

          <div id="liveMatches" class="card-body">
            <div class="loading">Loading...</div>
          </div>

        </div>


        <!-- RESULTS -->
        <div class="card">

          <div class="card-header">
            <div class="card-title">Recent results</div>
            <div id="resultsCount" class="card-count">Last 10</div>
          </div>

          <div id="results" class="card-body">
            <div class="loading">Loading...</div>
          </div>

        </div>


        <!-- UPCOMING -->
        <div class="card">

          <div class="card-header">
            <div class="card-title">Upcoming fixtures</div>
            <div id="upcomingCount" class="card-count">Next 10</div>
          </div>

          <div id="upcoming" class="card-body">
            <div class="loading">Loading...</div>
          </div>

        </div>

      </section>


      <!-- RIGHT -->
      <aside class="right-column">

        <!-- LEAGUE TABLE -->
        <div class="card">

          <div class="card-header">
            <div class="card-title">League table</div>
            <div id="tableLeagueName" class="card-count">Premier League</div>
          </div>

          <div id="standings" class="standings-wrap">

            <div class="loading">
              Loading...
            </div>

          </div>

          <div class="table-footer">

            <button
              id="tableToggle"
              class="table-toggle"
              type="button"
            >
              Show more
            </button>

          </div>

        </div>


        <!-- TOP SCORERS -->
        <div class="card">

          <div class="card-header">
            <div class="card-title">Top scorers</div>
            <div class="card-count">Goals</div>
          </div>

          <div id="scorers">

            <div class="loading">
              Loading...
            </div>

          </div>

        </div>

      </aside>

    </main>


    <div class="footer">
      Data provided by football-data.org
    </div>

  </div>


  <!-- MATCH MODAL -->

  <div id="modalBackdrop" class="modal-backdrop">

    <div class="modal">

      <div class="modal-header">

        <div id="modalTitle" class="modal-title">
          Match
        </div>

        <button
          id="modalClose"
          class="modal-close"
          type="button"
        >
          ×
        </button>

      </div>

      <div id="modalContent">

        <div class="loading">
          Loading...
        </div>

      </div>

    </div>

  </div>


  <script>

    const API_BASE = "";

    const FEATURED_LEAGUES = [
      {
        key: "premier",
        code: "PL",
        name: "Premier League",
        country: "England"
      },
      {
        key: "laliga",
        code: "PD",
        name: "LaLiga",
        country: "Spain"
      },
      {
        key: "seriea",
        code: "SA",
        name: "Serie A",
        country: "Italy"
      },
      {
        key: "bundesliga",
        code: "BL1",
        name: "Bundesliga",
        country: "Germany"
      },
      {
        key: "ligue1",
        code: "FL1",
        name: "Ligue 1",
        country: "France"
      }
    ];

    let currentLeague = "premier";
    let currentTableRows = [];
    let tableExpanded = false;
    let teamsForSearch = [];


    /* -------------------------
       HELPERS
    ------------------------- */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function cleanTeamName(name) {

      return String(name || "")
        .replace(/\s+F\.?C\.?$/i, "")
        .replace(/^F\.?C\.?\s+/i, "")
        .replace(/\s+C\.?F\.?$/i, "")
        .trim();

    }


    function teamName(team) {

      return cleanTeamName(
        team?.shortName ||
        team?.name ||
        "Unknown team"
      );

    }


    function formatDate(dateString) {

      if (!dateString) return "";

      const date = new Date(dateString);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleDateString("en-AU", {
        day: "2-digit",
        month: "short"
      });

    }


    function formatTime(dateString) {

      if (!dateString) return "";

      const date = new Date(dateString);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleTimeString("en-AU", {
        hour: "2-digit",
        minute: "2-digit"
      });

    }


    function formatMatchDate(dateString) {

      const date = formatDate(dateString);
      const time = formatTime(dateString);

      if (!date && !time) return "";

      return `${date} ${time}`;

    }


    function crest(team) {

      if (!team?.crest) {
        return "";
      }

      return `
        <img
          src="${escapeHtml(team.crest)}"
          alt=""
          loading="lazy"
          onerror="this.style.display='none'"
        />
      `;

    }


    function teamUrl(team, leagueKey) {

      if (!team?.id) {
        return "#";
      }

      return `team.html?teamId=${encodeURIComponent(team.id)}&league=${encodeURIComponent(leagueKey)}`;

    }


    async function fetchApi(path) {

      const controller = new AbortController();

      const timeout = setTimeout(() => {
        controller.abort();
      }, 15000);

      try {

        const response = await fetch(
          `${API_BASE}${path}`,
          {
            signal: controller.signal
          }
        );

        const text = await response.text();

        let data;

        try {
          data = text ? JSON.parse(text) : {};
        } catch (_) {
          throw new Error("The server returned invalid JSON.");
        }

        if (!response.ok) {

          throw new Error(
            data?.error ||
            data?.message ||
            `Request failed with HTTP ${response.status}`
          );

        }

        return data;

      } catch (error) {

        if (error.name === "AbortError") {
          throw new Error("Request timed out.");
        }

        throw error;

      } finally {

        clearTimeout(timeout);

      }

    }


    /* -------------------------
       MATCH RENDERING
    ------------------------- */

    function renderMatchRow(match) {

      const home = match.homeTeam;
      const away = match.awayTeam;

      const homeScore =
        match.score?.fullTime?.home ??
        "-";

      const awayScore =
        match.score?.fullTime?.away ??
        "-";

      const status = match.status || "";

      let statusText = "";

      if (
        status === "IN_PLAY" ||
        status === "LIVE"
      ) {

        statusText =
          match.minute
            ? `${match.minute}'`
            : "LIVE";

      } else if (status === "PAUSED") {

        statusText = "HT";

      } else if (status === "FINISHED") {

        statusText = "FT";

      } else {

        statusText = formatTime(match.utcDate);

      }


      const statusClass =
        status === "IN_PLAY" ||
        status === "LIVE" ||
        status === "PAUSED"
          ? "status-live"
          : status === "FINISHED"
            ? "status-finished"
            : "";


      return `

        <button
          class="match-row"
          type="button"
          data-match-id="${escapeHtml(match.id)}"
        >

          <div class="match-meta">

            <div class="match-date">
              ${escapeHtml(formatDate(match.utcDate))}
            </div>

            <div>
              ${escapeHtml(
                status === "FINISHED"
                  ? "Full time"
                  : formatTime(match.utcDate)
              )}
            </div>

          </div>


          <div class="match-teams">

            <div class="team-line">

              ${crest(home)}

              <span class="team-name">
                ${escapeHtml(teamName(home))}
              </span>

            </div>


            <div class="team-line">

              ${crest(away)}

              <span class="team-name">
                ${escapeHtml(teamName(away))}
              </span>

            </div>

          </div>


          <div class="match-score">

            <div>
              ${escapeHtml(homeScore)}
            </div>

            <div>
              ${escapeHtml(awayScore)}
            </div>

            <span class="match-status ${statusClass}">
              ${escapeHtml(statusText)}
            </span>

          </div>

        </button>

      `;

    }


    function renderMatches(
      containerId,
      matches,
      emptyText
    ) {

      const container =
        document.getElementById(containerId);

      if (!container) return;


      if (!Array.isArray(matches) || !matches.length) {

        container.innerHTML =
          `<div class="empty">${escapeHtml(emptyText)}</div>`;

        return;

      }


      container.innerHTML =
        matches.map(renderMatchRow).join("");

    }


    /* -------------------------
       LEAGUE DATA
    ------------------------- */

    async function loadLeague(leagueKey) {

      currentLeague = leagueKey;

      const liveContainer =
        document.getElementById("liveMatches");

      const resultsContainer =
        document.getElementById("results");

      const upcomingContainer =
        document.getElementById("upcoming");

      const standingsContainer =
        document.getElementById("standings");


      liveContainer.innerHTML =
        `<div class="loading">Loading...</div>`;

      resultsContainer.innerHTML =
        `<div class="loading">Loading...</div>`;

      upcomingContainer.innerHTML =
        `<div class="loading">Loading...</div>`;

      standingsContainer.innerHTML =
        `<div class="loading">Loading...</div>`;


      tableExpanded = false;

      updateTableToggle();


      try {

        const data =
          await fetchApi(
            `/api/league-data?league=${encodeURIComponent(leagueKey)}`
          );


        const competition =
          data.competition || {};


        document.getElementById(
          "tableLeagueName"
        ).textContent =
          competition.shortName ||
          competition.name ||
          leagueKey;


        const live =
          data.live?.matches || [];

        const results =
          data.results?.matches || [];

        const upcoming =
          data.upcoming?.matches || [];


        renderMatches(
          "liveMatches",
          live,
          "No live matches right now."
        );


        renderMatches(
          "results",
          results.slice(0, 10),
          "No recent results available."
        );


        renderMatches(
          "upcoming",
          upcoming.slice(0, 10),
          "No upcoming fixtures available."
        );


        document.getElementById(
          "liveCount"
        ).textContent =
          `${live.length} live`;


        document.getElementById(
          "resultsCount"
        ).textContent =
          `${Math.min(results.length, 10)} matches`;


        document.getElementById(
          "upcomingCount"
        ).textContent =
          `${Math.min(upcoming.length, 10)} matches`;


        currentTableRows =
          Array.isArray(data.standings?.TOTAL)
            ? data.standings.TOTAL
            : [];


        renderStandings();

      } catch (error) {

        liveContainer.innerHTML =
          `<div class="error">${escapeHtml(error.message)}</div>`;

        resultsContainer.innerHTML =
          `<div class="error">${escapeHtml(error.message)}</div>`;

        upcomingContainer.innerHTML =
          `<div class="error">${escapeHtml(error.message)}</div>`;

        standingsContainer.innerHTML =
          `<div class="error">${escapeHtml(error.message)}</div>`;

      }

    }


    /* -------------------------
       STANDINGS
    ------------------------- */

    function renderStandings() {

      const container =
        document.getElementById("standings");


      if (!currentTableRows.length) {

        container.innerHTML =
          `<div class="empty">League table unavailable.</div>`;

        return;

      }


      const visibleRows =
        tableExpanded
          ? currentTableRows
          : currentTableRows.slice(0, 10);


      let html = `

        <table class="standings-table">

          <thead>

            <tr>

              <th>#</th>
              <th>Team</th>
              <th>P</th>
              <th>W</th>
              <th>D</th>
              <th>L</th>
              <th>GF</th>
              <th>GA</th>
              <th>GD</th>
              <th>Pts</th>

            </tr>

          </thead>

          <tbody>

      `;


      visibleRows.forEach((row, index) => {

        const position =
          row.position ??
          index + 1;

        const team =
          row.team || {};


        html += `

          <tr>

            <td class="standing-position">
              ${escapeHtml(position)}
            </td>


            <td>

              <a
                class="standing-team"
                href="${escapeHtml(teamUrl(team, currentLeague))}"
              >

                ${crest(team)}

                <span class="standing-name">
                  ${escapeHtml(teamName(team))}
                </span>

              </a>

            </td>


            <td>
              ${escapeHtml(row.playedGames ?? 0)}
            </td>

            <td>
              ${escapeHtml(row.won ?? 0)}
            </td>

            <td>
              ${escapeHtml(row.draw ?? 0)}
            </td>

            <td>
              ${escapeHtml(row.lost ?? 0)}
            </td>

            <td>
              ${escapeHtml(row.goalsFor ?? 0)}
            </td>

            <td>
              ${escapeHtml(row.goalsAgainst ?? 0)}
            </td>

            <td>
              ${escapeHtml(row.goalDifference ?? 0)}
            </td>

            <td class="points">
              ${escapeHtml(row.points ?? 0)}
            </td>

          </tr>

        `;

      });


      html += `

          </tbody>

        </table>

      `;


      container.innerHTML = html;

      updateTableToggle();

    }


    function updateTableToggle() {

      const button =
        document.getElementById("tableToggle");


      if (!button) return;


      if (currentTableRows.length <= 10) {

        button.style.display = "none";

        return;

      }


      button.style.display = "inline-block";

      button.textContent =
        tableExpanded
          ? "Show less"
          : `Show all ${currentTableRows.length} teams`;

    }


    document
      .getElementById("tableToggle")
      .addEventListener("click", () => {

        tableExpanded =
          !tableExpanded;

        renderStandings();

      });


    /* -------------------------
       COMPETITIONS
    ------------------------- */

    async function loadCompetitions() {

      try {

        const data =
          await fetchApi("/api/competitions");

        const competitions =
          Array.isArray(data.competitions)
            ? data.competitions
            : [];


        renderCompetitionDropdown(
          competitions
        );

      } catch (error) {

        console.error(
          "Could not load competitions:",
          error
        );

      }

    }


    function renderCompetitionDropdown(
      competitions
    ) {

      const select =
        document.getElementById("leagueSelect");


      const map =
        new Map();


      FEATURED_LEAGUES.forEach(
        league => map.set(league.key, league)
      );


      competitions.forEach(
        competition => {

          if (!competition?.key) {
            return;
          }

          if (!map.has(competition.key)) {
            map.set(
              competition.key,
              competition
            );
          }

        }
      );


      const ordered =
        Array.from(map.values());


      select.innerHTML = "";


      ordered.forEach(
        competition => {

          const option =
            document.createElement("option");

          option.value =
            competition.key;

          option.textContent =
            competition.country
              ? `${competition.name} — ${competition.country}`
              : competition.name;


          if (
            competition.key === currentLeague
          ) {
            option.selected = true;
          }


          select.appendChild(option);

        }
      );

    }


    document
      .getElementById("leagueSelect")
      .addEventListener(
        "change",
        event => {

          const league =
            event.target.value;

          loadLeague(league);

          loadTeamsForSearch();

        }
      );


    /* -------------------------
       TOP SCORERS
    ------------------------- */

    async function loadScorers() {

      const container =
        document.getElementById("scorers");


      container.innerHTML =
        `<div class="loading">Loading...</div>`;


      try {

        const data =
          await fetchApi(
            `/api/scorers?league=${encodeURIComponent(currentLeague)}`
          );


        const scorers =
          Array.isArray(data.scorers)
            ? data.scorers
            : [];


        if (!scorers.length) {

          container.innerHTML =
            `<div class="empty">No scorer data available.</div>`;

          return;

        }


        container.innerHTML =
          scorers
            .slice(0, 10)
            .map((scorer, index) => {

              const player =
                scorer.player || {};

              const team =
                scorer.team || {};


              return `

                <div class="scorer-row">

                  <div class="scorer-number">
                    ${index + 1}
                  </div>

                  <div class="scorer-info">

                    <div class="scorer-name">
                      ${escapeHtml(player.name || "Unknown player")}
                    </div>

                    <div class="scorer-team">
                      ${escapeHtml(teamName(team))}
                    </div>

                  </div>

                  <div class="scorer-goals">
                    ${escapeHtml(scorer.goals ?? 0)}
                  </div>

                </div>

              `;

            })
            .join("");

      } catch (error) {

        container.innerHTML =
          `<div class="error">${escapeHtml(error.message)}</div>`;

      }

    }


    /* -------------------------
       TEAM SEARCH
    ------------------------- */

    async function loadTeamsForSearch() {

      try {

        const data =
          await fetchApi(
            `/api/teams?league=${encodeURIComponent(currentLeague)}`
          );


        teamsForSearch =
          Array.isArray(data.teams)
            ? data.teams
            : [];

      } catch (error) {

        console.error(
          "Could not load teams:",
          error
        );

        teamsForSearch = [];

      }

    }


    function showSearchResults(
      query
    ) {

      const container =
        document.getElementById("searchResults");


      const cleanQuery =
        query.trim().toLowerCase();


      if (!cleanQuery) {

        container.style.display = "none";
        container.innerHTML = "";

        return;

      }


      const matches =
        teamsForSearch
          .filter(team => {

            const name =
              teamName(team)
                .toLowerCase();

            const full =
              String(team.name || "")
                .toLowerCase();

            return (
              name.includes(cleanQuery) ||
              full.includes(cleanQuery)
            );

          })
          .slice(0, 8);


      if (!matches.length) {

        container.innerHTML =
          `<div class="empty">No teams found.</div>`;

        container.style.display = "block";

        return;

      }


      container.innerHTML =
        matches
          .map(team => {

            return `

              <button
                class="search-result"
                type="button"
                data-team-id="${escapeHtml(team.id)}"
              >

                ${crest(team)}

                <div>

                  <div class="search-result-name">
                    ${escapeHtml(teamName(team))}
                  </div>

                  <div class="search-result-country">
                    ${escapeHtml(team.area?.name || "")}
                  </div>

                </div>

              </button>

            `;

          })
          .join("");


      container.style.display = "block";

    }


    document
      .getElementById("teamSearch")
      .addEventListener(
        "input",
        event => {

          showSearchResults(
            event.target.value
          );

        }
      );


    document
      .getElementById("searchResults")
      .addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              ".search-result"
            );


          if (!button) return;


          const teamId =
            button.dataset.teamId;


          if (!teamId) return;


          window.location.href =
            `team.html?teamId=${encodeURIComponent(teamId)}&league=${encodeURIComponent(currentLeague)}`;

        }
      );


    document.addEventListener(
      "click",
      event => {

        const searchWrap =
          document.querySelector(
            ".search-wrap"
          );


        if (
          searchWrap &&
          !searchWrap.contains(event.target)
        ) {

          document.getElementById(
            "searchResults"
          ).style.display = "none";

        }

      }
    );


    /* -------------------------
       MATCH MODAL
    ------------------------- */

    const modalBackdrop =
      document.getElementById(
        "modalBackdrop"
      );

    const modalContent =
      document.getElementById(
        "modalContent"
      );


    function closeModal() {

      modalBackdrop.classList.remove(
        "open"
      );

    }


    document
      .getElementById("modalClose")
      .addEventListener(
        "click",
        closeModal
      );


    modalBackdrop.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          modalBackdrop
        ) {

          closeModal();

        }

      }
    );


    document.addEventListener(
      "click",
      async event => {

        const matchButton =
          event.target.closest(
            ".match-row"
          );


        if (!matchButton) return;


        const matchId =
          matchButton.dataset.matchId;


        if (!matchId) return;


        modalBackdrop.classList.add(
          "open"
        );


        modalContent.innerHTML =
          `<div class="loading">Loading match...</div>`;


        try {

          const data =
            await fetchApi(
              `/api/match?matchId=${encodeURIComponent(matchId)}`
            );


          renderMatchModal(
            data.match
          );

        } catch (error) {

          modalContent.innerHTML =
            `<div class="error">${escapeHtml(error.message)}</div>`;

        }

      }
    );


    function renderMatchModal(match) {

      if (!match) {

        modalContent.innerHTML =
          `<div class="error">Match data unavailable.</div>`;

        return;

      }


      const home =
        match.homeTeam || {};

      const away =
        match.awayTeam || {};


      const homeScore =
        match.score?.fullTime?.home ??
        "-";

      const awayScore =
        match.score?.fullTime?.away ??
        "-";


      let statusText =
        match.status || "";


      if (
        match.status === "FINISHED"
      ) {

        statusText = "Full time";

      } else if (
        match.status === "IN_PLAY" ||
        match.status === "LIVE"
      ) {

        statusText =
          match.minute
            ? `${match.minute}'`
            : "Live";

      }


      document.getElementById(
        "modalTitle"
      ).textContent =
        match.competition?.name ||
        "Match";


      modalContent.innerHTML = `

        <div class="modal-match">

          <div class="modal-teams">

            <div class="modal-team">

              ${crest(home)}

              <div class="modal-team-name">
                ${escapeHtml(teamName(home))}
              </div>

            </div>


            <div>

              <div class="modal-score">
                ${escapeHtml(homeScore)}
                -
                ${escapeHtml(awayScore)}
              </div>

              <div class="modal-status">
                ${escapeHtml(statusText)}
              </div>

            </div>


            <div class="modal-team">

              ${crest(away)}

              <div class="modal-team-name">
                ${escapeHtml(teamName(away))}
              </div>

            </div>

          </div>


          <div style="margin-top:15px;color:var(--muted);font-size:11px;">
            ${escapeHtml(formatMatchDate(match.utcDate))}
          </div>

        </div>

      `;

    }


    /* -------------------------
       START
    ------------------------- */

    async function start() {

      /*
        Load the Premier League immediately.
        This prevents the page sitting on
        "Loading..." while competitions are fetched.
      */

      await loadLeague("premier");


      /*
        These can load independently.
      */

      loadCompetitions();

      loadScorers();

      loadTeamsForSearch();

    }


    start();

  </script>

</body>
</html>
