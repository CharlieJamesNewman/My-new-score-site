<!DOCTYPE html>
<html lang="en">
<head>

  <link
    rel="icon"
    type="image/png"
    href="scoredash-icon.png"
  >

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>SCOREDASH</title>

  <style>

    :root {
      --bg: #080a0d;
      --panel: #11151a;
      --panel-2: #171c22;
      --border: #252c34;
      --text: #f4f6f8;
      --muted: #89929d;
      --accent: #c9ff4a;
      --danger: #ff5c5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .header {
      border-bottom: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand-link {
      display: inline-block;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      cursor: pointer;
    }

    .brand b {
      color: var(--accent);
    }

    .brand-link:hover .brand {
      opacity: 0.9;
    }

    .tagline {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-wrap {
      position: relative;
      width: 300px;
    }

    .search {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
    }

    .search::placeholder {
      color: var(--muted);
    }

    .search-results {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 7px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      z-index: 100;
      display: none;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    .search-results.show {
      display: block;
    }

    .search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 11px 13px;
      cursor: pointer;
    }

    .search-result:hover {
      background: var(--panel-2);
    }

    .search-result img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .search-result-name {
      font-size: 13px;
      font-weight: 800;
    }

    .search-result-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .search-message {
      padding: 13px;
      color: var(--muted);
      font-size: 12px;
    }

    main {
      max-width: 1240px;
      margin: auto;
      padding: 22px 20px 60px;
    }

    .league-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .league-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .league-select {
      min-width: 300px;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .league-select:focus {
      border-color: var(--accent);
    }

    .league-select option {
      background: var(--panel);
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 400px;
      gap: 18px;
      align-items: start;
    }

    .left-column,
    .right-column {
      min-width: 0;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: -6px;
      margin-bottom: 10px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
    }

    .message {
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .error {
      color: #ff9b9b;
    }

    .match {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .match:last-child {
      border-bottom: 0;
    }

    .match:hover {
      background: var(--panel-2);
    }

    .match-main {
      padding: 13px 15px;
    }

    .match-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .team.away {
      justify-content: flex-end;
      text-align: right;
    }

    .team img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .team-name {
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score-area {
      text-align: center;
    }

    .score {
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .match-status {
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .match.live .match-status {
      color: var(--accent);
      font-weight: 800;
    }

    .match-details {
      display: none;
      border-top: 1px solid var(--border);
      background: #0d1115;
      padding: 12px 15px 15px;
    }

    .match.expanded .match-details {
      display: block;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      gap: 8px;
      align-items: center;
      padding: 5px 0;
      font-size: 12px;
    }

    .detail-team {
      color: var(--muted);
    }

    .detail-team.right {
      text-align: right;
    }

    .detail-type {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
    }

    .empty-details {
      color: var(--muted);
      font-size: 12px;
    }

    .table-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      color: var(--muted);
      font-size: 10px;
      text-align: right;
      padding: 10px 9px;
      white-space: nowrap;
    }

    th:first-child,
    th:nth-child(2) {
      text-align: left;
    }

    td {
      border-top: 1px solid var(--border);
      padding: 10px 9px;
      font-size: 12px;
      text-align: right;
    }

    td:first-child,
    td:nth-child(2) {
      text-align: left;
    }

    .position {
      color: var(--muted);
      width: 30px;
    }

    .table-team {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .table-team img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .table-team-name {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-scorer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--border);
    }

    .top-scorer:last-child {
      border-bottom: 0;
    }

    .scorer-name {
      font-weight: 800;
      font-size: 12px;
    }

    .scorer-team {
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .scorer-goals {
      font-size: 15px;
      font-weight: 900;
    }

    .league-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .league-emblem {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .league-heading-name {
      font-size: 18px;
      font-weight: 900;
    }

    .small-note {
      color: var(--muted);
      font-size: 10px;
      margin-top: 6px;
    }

    footer {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px 30px;
      color: var(--muted);
      font-size: 10px;
    }

    @media (max-width: 900px) {

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-right {
        width: 100%;
      }

      .search-wrap {
        width: 100%;
      }

      .layout {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 600px) {

      main {
        padding: 17px 12px 45px;
      }

      .header {
        padding: 18px 12px;
      }

      .brand {
        font-size: 25px;
      }

      .league-bar {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }

      .league-select {
        width: 100%;
        min-width: 0;
      }

      .match-grid {
        grid-template-columns: minmax(0, 1fr) 65px minmax(0, 1fr);
      }

      .team-name {
        font-size: 11px;
      }

      .team img {
        width: 25px;
        height: 25px;
      }

      .score {
        font-size: 16px;
      }

      th,
      td {
        padding-left: 6px;
        padding-right: 6px;
      }

    }

  </style>

</head>

<body>

<header class="header">

  <div>

    <a
      class="brand-link"
      href="index.html"
      aria-label="SCOREDASH home"
    >

      <div class="brand">
        SCORE<b>DASH</b>
      </div>

    </a>

    <div class="tagline">
      Football scores & fixtures
    </div>

  </div>

  <div class="header-right">

    <div class="search-wrap">

      <input
        id="teamSearch"
        class="search"
        type="text"
        autocomplete="off"
        placeholder="Search for any team..."
        aria-label="Search for any team"
      />

      <div
        id="searchResults"
        class="search-results"
      ></div>

    </div>

  </div>

</header>

<main>

  <div class="league-bar">

    <div class="league-label">
      LEAGUE
    </div>

    <select
      id="leagueSelect"
      class="league-select"
      aria-label="Select league"
    ></select>

  </div>

  <div
    id="leagueHeading"
    class="league-heading"
  ></div>

  <div class="layout">

    <div class="left-column">

      <section class="section">

        <div class="section-title">
          Live matches
        </div>

        <div
          id="liveMatches"
          class="panel"
        >

          <div class="message">
            Loading...
          </div>

        </div>

      </section>

      <section class="section">

        <div class="section-title">
          Recent results
        </div>

        <div class="section-subtitle">
          Last 10
        </div>

        <div
          id="recentMatches"
          class="panel"
        >

          <div class="message">
            Loading...
          </div>

        </div>

      </section>

      <section class="section">

        <div class="section-title">
          Upcoming fixtures
        </div>

        <div class="section-subtitle">
          Next 10
        </div>

        <div
          id="upcomingMatches"
          class="panel"
        >

          <div class="message">
            Loading...
          </div>

        </div>

      </section>

    </div>

    <div class="right-column">

      <section class="section">

        <div class="section-title">
          League table
        </div>

        <div
          id="standings"
          class="table-panel"
        >

          <div class="message">
            Loading...
          </div>

        </div>

      </section>

      <section class="section">

        <div class="section-title">
          Top scorers
        </div>

        <div
          id="scorers"
          class="panel"
        >

          <div class="message">
            Loading...
          </div>

        </div>

      </section>

    </div>

  </div>

</main>

<footer>
  Data provided by football-data.org
</footer>

<script>

const API_BASE = "";

const FEATURED_LEAGUES = [
  {
    key: "premier",
    code: "PL",
    name: "Premier League",
    country: "England"
  },
  {
    key: "laliga",
    code: "PD",
    name: "LaLiga",
    country: "Spain"
  },
  {
    key: "seriea",
    code: "SA",
    name: "Serie A",
    country: "Italy"
  },
  {
    key: "bundesliga",
    code: "BL1",
    name: "Bundesliga",
    country: "Germany"
  },
  {
    key: "ligue1",
    code: "FL1",
    name: "Ligue 1",
    country: "France"
  }
];

let leagues = [...FEATURED_LEAGUES];

let currentLeague = "premier";

let expandedMatchId = null;

let searchTimer = null;

const q = selector =>
  document.querySelector(selector);

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

async function fetchApi(endpoint) {

  const response = await fetch(
    API_BASE + endpoint,
    {
      cache: "no-store"
    }
  );

  let data = {};

  try {
    data = await response.json();
  } catch (_) {}

  if (!response.ok) {

    throw new Error(
      data?.error ||
      `HTTP ${response.status}`
    );

  }

  return data;

}

function teamName(team) {

  return (
    team?.name ||
    team?.shortName ||
    "Unknown team"
  );

}

function crest(team) {

  if (!team?.crest) {
    return "";
  }

  return `
    <img
      src="${escapeHtml(team.crest)}"
      alt=""
      loading="lazy"
      onerror="this.style.display='none'"
    >
  `;

}

function formatDate(value) {

  if (!value) {
    return "";
  }

  return new Date(value)
    .toLocaleDateString(
      "en-AU",
      {
        day: "numeric",
        month: "short"
      }
    );

}

function formatTime(value) {

  if (!value) {
    return "";
  }

  return new Date(value)
    .toLocaleTimeString(
      "en-AU",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

}

function formatMatchScore(match) {

  const home =
    match.score?.fullTime?.home;

  const away =
    match.score?.fullTime?.away;

  if (
    home !== null &&
    home !== undefined &&
    away !== null &&
    away !== undefined
  ) {

    return `
      ${escapeHtml(home)}
      -
      ${escapeHtml(away)}
    `;

  }

  return "-";

}

function matchStatus(match) {

  if (
    [
      "IN_PLAY",
      "LIVE",
      "PAUSED"
    ].includes(match.status)
  ) {

    if (match.minute) {
      return `${match.minute}'`;
    }

    return "LIVE";

  }

  if (match.status === "FINISHED") {
    return "FT";
  }

  if (match.status === "POSTPONED") {
    return "Postponed";
  }

  if (match.status === "CANCELLED") {
    return "Cancelled";
  }

  return `
    ${formatDate(match.utcDate)}
    ${formatTime(match.utcDate)}
  `;

}

function renderMatches(
  matches,
  containerSelector
) {

  const container =
    q(containerSelector);

  if (!Array.isArray(matches) || !matches.length) {

    container.innerHTML = `
      <div class="message">
        No matches available.
      </div>
    `;

    return;

  }

  container.innerHTML =
    matches
      .map(match => {

        const live =
          [
            "IN_PLAY",
            "LIVE",
            "PAUSED"
          ].includes(match.status);

        const expanded =
          Number(match.id) ===
          Number(expandedMatchId);

        return `

          <div
            class="match ${live ? "live" : ""} ${expanded ? "expanded" : ""}"
            data-match-id="${escapeHtml(match.id)}"
          >

            <div
              class="match-main"
              data-match-toggle="${escapeHtml(match.id)}"
            >

              <div class="match-grid">

                <div class="team">

                  ${crest(match.homeTeam)}

                  <span class="team-name">
                    ${escapeHtml(
                      teamName(match.homeTeam)
                    )}
                  </span>

                </div>

                <div class="score-area">

                  <div class="score">
                    ${formatMatchScore(match)}
                  </div>

                  <div class="match-status">
                    ${escapeHtml(
                      matchStatus(match)
                    )}
                  </div>

                </div>

                <div class="team away">

                  <span class="team-name">
                    ${escapeHtml(
                      teamName(match.awayTeam)
                    )}
                  </span>

                  ${crest(match.awayTeam)}

                </div>

              </div>

            </div>

            <div
              class="match-details"
              id="details-${escapeHtml(match.id)}"
            >

              <div class="empty-details">
                Loading match details...
              </div>

            </div>

          </div>

        `;

      })
      .join("");

  container
    .querySelectorAll(
      "[data-match-toggle]"
    )
    .forEach(element => {

      element.addEventListener(
        "click",
        () => {

          const matchId =
            element.dataset.matchToggle;

          toggleMatch(matchId);

        }
      );

    });

}

async function toggleMatch(matchId) {

  const matchElement =
    document.querySelector(
      `.match[data-match-id="${CSS.escape(String(matchId))}"]`
    );

  if (!matchElement) {
    return;
  }

  if (
    Number(expandedMatchId) ===
    Number(matchId)
  ) {

    expandedMatchId = null;

    matchElement.classList.remove(
      "expanded"
    );

    return;

  }

  document
    .querySelectorAll(".match.expanded")
    .forEach(element => {

      element.classList.remove(
        "expanded"
      );

    });

  expandedMatchId = matchId;

  matchElement.classList.add(
    "expanded"
  );

  const details =
    matchElement.querySelector(
      ".match-details"
    );

  details.innerHTML = `
    <div class="empty-details">
      Loading match details...
    </div>
  `;

  try {

    const data =
      await fetchApi(
        `/api/match?matchId=${encodeURIComponent(matchId)}`
      );

    renderMatchDetails(
      data.match,
      details
    );

  } catch (error) {

    details.innerHTML = `
      <div class="empty-details">
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}

function renderMatchDetails(
  match,
  container
) {

  const events = [];

  /*
    football-data.org may provide
    unfolded goals/bookings depending
    on API access and match availability.
  */

  if (
    Array.isArray(match?.goals)
  ) {

    for (const goal of match.goals) {

      events.push({
        minute:
          goal.minute ??
          goal.injuryTime ??
          "",
        team:
          goal.team?.id,
        player:
          goal.scorer?.name ||
          goal.player?.name ||
          "Goal",
        type:
          goal.type === "OWN_GOAL"
            ? "Own goal"
            : "Goal"
      });

    }

  }

  if (
    Array.isArray(match?.bookings)
  ) {

    for (const booking of match.bookings) {

      events.push({
        minute:
          booking.minute ??
          booking.injuryTime ??
          "",
        team:
          booking.team?.id,
        player:
          booking.player?.name ||
          "Player",
        type:
          booking.card === "RED"
            ? "Red card"
            : "Yellow card"
      });

    }

  }

  if (!events.length) {

    container.innerHTML = `
      <div class="empty-details">
        No detailed match events are available for this match.
      </div>
    `;

    return;

  }

  events.sort(
    (a, b) =>
      Number(a.minute || 0) -
      Number(b.minute || 0)
  );

  container.innerHTML =
    events
      .map(event => {

        const home =
          Number(event.team) ===
          Number(match.homeTeam?.id);

        return `

          <div class="detail-row">

            <div class="detail-team ${home ? "" : "right"}">
              ${escapeHtml(event.player)}
            </div>

            <div class="detail-type">
              ${escapeHtml(event.minute)}'
              ·
              ${escapeHtml(event.type)}
            </div>

            <div class="detail-team ${home ? "right" : ""}">
              ${escapeHtml(
                home
                  ? teamName(match.homeTeam)
                  : teamName(match.awayTeam)
              )}
            </div>

          </div>

        `;

      })
      .join("");

}

function renderStandings(
  standings
) {

  const container =
    q("#standings");

  const rows =
    Array.isArray(standings)
      ? standings
      : [];

  if (!rows.length) {

    container.innerHTML = `
      <div class="message">
        League table is not available for this competition on the current API plan.
      </div>
    `;

    return;

  }

  container.innerHTML = `

    <table>

      <thead>

        <tr>
          <th>#</th>
          <th>Team</th>
          <th>MP</th>
          <th>W</th>
          <th>D</th>
          <th>L</th>
          <th>GD</th>
          <th>Pts</th>
        </tr>

      </thead>

      <tbody>

        ${rows
          .map(row => `

            <tr>

              <td class="position">
                ${escapeHtml(row.position)}
              </td>

              <td>

                <div class="table-team">

                  ${crest(row.team)}

                  <span class="table-team-name">
                    ${escapeHtml(
                      teamName(row.team)
                    )}
                  </span>

                </div>

              </td>

              <td>
                ${escapeHtml(
                  row.playedGames ?? 0
                )}
              </td>

              <td>
                ${escapeHtml(
                  row.won ?? 0
                )}
              </td>

              <td>
                ${escapeHtml(
                  row.draw ?? 0
                )}
              </td>

              <td>
                ${escapeHtml(
                  row.lost ?? 0
                )}
              </td>

              <td>
                ${escapeHtml(
                  row.goalDifference ?? 0
                )}
              </td>

              <td>
                <strong>
                  ${escapeHtml(
                    row.points ?? 0
                  )}
                </strong>
              </td>

            </tr>

          `)
          .join("")}

      </tbody>

    </table>

  `;

}

function renderScorers(
  scorers
) {

  const container =
    q("#scorers");

  if (
    !Array.isArray(scorers) ||
    !scorers.length
  ) {

    container.innerHTML = `
      <div class="message">
        No scorer data available.
      </div>
    `;

    return;

  }

  container.innerHTML =
    scorers
      .sort(
        (a, b) =>
          Number(b.goals || 0) -
          Number(a.goals || 0)
      )
      .slice(0, 10)
      .map(scorer => `

        <div class="top-scorer">

          <div>

            <div class="scorer-name">
              ${escapeHtml(
                scorer.player?.name ||
                "Unknown player"
              )}
            </div>

            <div class="scorer-team">
              ${escapeHtml(
                teamName(scorer.team)
              )}
            </div>

          </div>

          <div class="scorer-goals">
            ${escapeHtml(
              scorer.goals || 0
            )}
          </div>

        </div>

      `)
      .join("");

}

function populateLeagueSelector() {

  const select =
    q("#leagueSelect");

  select.innerHTML =
    leagues
      .map(league => `

        <option
          value="${escapeHtml(league.key)}"
        >
          ${escapeHtml(league.name)}
          ${league.country
            ? ` — ${escapeHtml(league.country)}`
            : ""}
        </option>

      `)
      .join("");

  select.value =
    currentLeague;

}

function renderLeagueHeading(
  competition
) {

  const container =
    q("#leagueHeading");

  if (!competition) {

    container.innerHTML = "";

    return;

  }

  container.innerHTML = `

    ${
      competition.emblem
        ? `
          <img
            class="league-emblem"
            src="${escapeHtml(
              competition.emblem
            )}"
            alt=""
            onerror="this.style.display='none'"
          >
        `
        : ""
    }

    <div class="league-heading-name">
      ${escapeHtml(
        competition.name ||
        "League"
      )}
    </div>

  `;

}

async function loadLeague(
  leagueKey
) {

  currentLeague =
    leagueKey;

  q("#liveMatches").innerHTML = `
    <div class="message">
      Loading...
    </div>
  `;

  q("#recentMatches").innerHTML = `
    <div class="message">
      Loading...
    </div>
  `;

  q("#upcomingMatches").innerHTML = `
    <div class="message">
      Loading...
    </div>
  `;

  q("#standings").innerHTML = `
    <div class="message">
      Loading...
    </div>
  `;

  try {

    const data =
      await fetchApi(
        `/api/league-data?league=${encodeURIComponent(leagueKey)}`
      );

    renderLeagueHeading(
      data.competition
    );

    renderMatches(
      data.live?.matches || [],
      "#liveMatches"
    );

    renderMatches(
      (data.results?.matches || [])
        .slice(0, 10),
      "#recentMatches"
    );

    renderMatches(
      (data.upcoming?.matches || [])
        .slice(0, 10),
      "#upcomingMatches"
    );

    if (
      data.standingsAvailable &&
      Array.isArray(
        data.standings?.TOTAL
      )
    ) {

      renderStandings(
        data.standings.TOTAL
      );

    } else {

      q("#standings").innerHTML = `
        <div class="message">
          ${
            escapeHtml(
              data.standingsError ||
              "League table is not available."
            )
          }
        </div>
      `;

    }

  } catch (error) {

    const message = `
      <div class="message error">
        ${escapeHtml(error.message)}
      </div>
    `;

    q("#liveMatches").innerHTML =
      message;

    q("#recentMatches").innerHTML =
      message;

    q("#upcomingMatches").innerHTML =
      message;

    q("#standings").innerHTML =
      message;

  }

}

async function loadCompetitions() {

  try {

    const data =
      await fetchApi(
        "/api/competitions"
      );

    if (
      Array.isArray(
        data.competitions
      )
    ) {

      const discovered =
        data.competitions;

      const merged = [];

      for (
        const featured
        of FEATURED_LEAGUES
      ) {

        const found =
          discovered.find(
            item =>
              item.code ===
              featured.code
          );

        merged.push(
          found || featured
        );

      }

      for (
        const competition
        of discovered
      ) {

        if (
          !merged.some(
            item =>
              item.code ===
              competition.code
          )
        ) {

          merged.push(
            competition
          );

        }

      }

      leagues = merged;

      populateLeagueSelector();

    }

  } catch (error) {

    console.error(
      "Competition loading failed:",
      error
    );

    populateLeagueSelector();

  }

}

async function loadScorers() {

  try {

    const data =
      await fetchApi(
        `/api/scorers?league=${encodeURIComponent(currentLeague)}`
      );

    renderScorers(
      data.scorers || []
    );

  } catch (error) {

    q("#scorers").innerHTML = `
      <div class="message">
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}

function renderSearchResults(
  teams
) {

  const container =
    q("#searchResults");

  if (
    !Array.isArray(teams) ||
    !teams.length
  ) {

    container.innerHTML = `
      <div class="search-message">
        No teams found.
      </div>
    `;

    container.classList.add(
      "show"
    );

    return;

  }

  container.innerHTML =
    teams
      .slice(0, 30)
      .map(team => `

        <button
          class="search-result"
          type="button"
          data-team-id="${escapeHtml(
            team.team?.id
          )}"
          data-team-league="${escapeHtml(
            team.competition?.key ||
            ""
          )}"
        >

          ${crest(team.team)}

          <div>

            <div class="search-result-name">
              ${escapeHtml(
                teamName(team.team)
              )}
            </div>

            <div class="search-result-meta">
              ${escapeHtml(
                team.competition?.name ||
                ""
              )}
              ${
                team.competition?.country
                  ? ` · ${escapeHtml(
                      team.competition.country
                    )}`
                  : ""
              }
            </div>

          </div>

        </button>

      `)
      .join("");

  container.classList.add(
    "show"
  );

  container
    .querySelectorAll(
      ".search-result"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const teamId =
            button.dataset.teamId;

          const teamLeague =
            button.dataset.teamLeague ||
            currentLeague;

          window.location.href =
            `team.html?teamId=${encodeURIComponent(teamId)}&league=${encodeURIComponent(teamLeague)}`;

        }
      );

    });

}

async function searchTeams(
  query
) {

  const cleanQuery =
    query.trim();

  if (
    cleanQuery.length < 2
  ) {

    q("#searchResults")
      .classList.remove(
        "show"
      );

    return;

  }

  try {

    const data =
      await fetchApi(
        `/api/team-search?q=${encodeURIComponent(cleanQuery)}`
      );

    renderSearchResults(
      data.teams || []
    );

  } catch (error) {

    q("#searchResults").innerHTML = `
      <div class="search-message">
        ${escapeHtml(error.message)}
      </div>
    `;

    q("#searchResults")
      .classList.add(
        "show"
      );

  }

}

q("#leagueSelect")
  .addEventListener(
    "change",
    async event => {

      const league =
        event.target.value;

      await loadLeague(
        league
      );

      await loadScorers();

    }
  );

q("#teamSearch")
  .addEventListener(
    "input",
    event => {

      const value =
        event.target.value;

      clearTimeout(
        searchTimer
      );

      if (
        value.trim().length < 2
      ) {

        q("#searchResults")
          .classList.remove(
            "show"
          );

        return;

      }

      q("#searchResults").innerHTML = `
        <div class="search-message">
          Searching...
        </div>
      `;

      q("#searchResults")
        .classList.add(
          "show"
        );

      searchTimer =
        setTimeout(
          () => {
            searchTeams(value);
          },
          180
        );

    }
  );

document.addEventListener(
  "click",
  event => {

    const searchWrap =
      document.querySelector(
        ".search-wrap"
      );

    if (
      !searchWrap.contains(
        event.target
      )
    ) {

      q("#searchResults")
        .classList.remove(
          "show"
        );

    }

  }
);

async function start() {

  populateLeagueSelector();

  /*
    Premier League is always
    the default league.
  */

  q("#leagueSelect").value =
    "premier";

  /*
    Load the main league first.
  */

  await loadLeague(
    "premier"
  );

  /*
    These can load afterwards.
  */

  loadCompetitions();

  loadScorers();

}

start();

</script>

</body>
</html>
