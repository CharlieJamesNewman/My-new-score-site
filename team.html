<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<link
  rel="icon"
  type="image/png"
  href="scoredash-icon.png"
>

<title>SCOREdash — Team</title>

<style>

:root {
  --bg: #080a0d;
  --panel: #11151a;
  --panel-2: #171c22;
  --border: #252c34;
  --text: #f4f6f8;
  --muted: #89929d;
  --accent: #c9ff4a;
  --danger: #ff5c5c;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  border-bottom: 1px solid var(--border);
  padding: 24px 20px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
}

.logo {
  display: inline-block;
  font-size: 27px;
  font-weight: 800;
  cursor: pointer;
}

.logo:hover {
  opacity: 0.9;
}

.logo b {
  color: var(--accent);
}

.back {
  display: inline-block;
  margin-top: 12px;
  color: var(--muted);
  font-size: 13px;
}

.back:hover {
  color: var(--accent);
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 20px 60px;
}

.hero {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 25px;
  display: flex;
  gap: 22px;
  align-items: center;
}

.hero-logo {
  width: 90px;
  height: 90px;
  object-fit: contain;
  flex: 0 0 auto;
}

.hero-name {
  font-size: 31px;
  font-weight: 900;
}

.hero-meta {
  color: var(--muted);
  margin-top: 6px;
  font-size: 13px;
}

.stats {
  display: grid;
  grid-template-columns:
    repeat(4, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}

.stat-number {
  font-size: 23px;
  font-weight: 900;
}

.stat-label {
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}

.section {
  margin-top: 25px;
}

.section-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 12px;
}

.matches {
  display: grid;
  gap: 8px;
}

.match {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
}

.match-grid {
  display: grid;
  grid-template-columns:
    1fr 80px 1fr;
  align-items: center;
  gap: 10px;
}

.team {
  display: flex;
  align-items: center;
  gap: 8px;
}

.team.away {
  justify-content: flex-end;
  text-align: right;
}

.team img {
  width: 28px;
  height: 28px;
  object-fit: contain;
}

.team-name {
  font-size: 13px;
  font-weight: 700;
}

.score {
  text-align: center;
  font-weight: 900;
  font-size: 18px;
}

.time {
  color: var(--muted);
  font-size: 11px;
  text-align: center;
  margin-top: 3px;
}

.table-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  color: var(--muted);
  font-size: 11px;
  text-align: right;
  padding: 11px;
}

th:first-child,
th:nth-child(2) {
  text-align: left;
}

td {
  border-top: 1px solid var(--border);
  padding: 11px;
  font-size: 13px;
  text-align: right;
}

td:first-child,
td:nth-child(2) {
  text-align: left;
}

.player {
  font-weight: 700;
}

.message {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 20px;
  color: var(--muted);
}

.error {
  color: #ff9b9b;
}

@media (max-width: 700px) {

  main {
    padding: 18px 15px 45px;
  }

  .hero {
    padding: 18px;
  }

  .hero-logo {
    width: 65px;
    height: 65px;
  }

  .hero-name {
    font-size: 23px;
  }

  .stats {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .match-grid {
    grid-template-columns:
      1fr 60px 1fr;
  }

  .team-name {
    font-size: 11px;
  }
}

</style>

</head>

<body>

<header>

  <div class="header-inner">

    <a
      class="logo"
      href="index.html"
      aria-label="Go to SCOREdash homepage"
    >
      SCORE<b>DASH</b>
    </a>

    <a
      class="back"
      href="index.html"
    >
      ← Back to scores
    </a>

  </div>

</header>

<main>

  <div
    id="team-hero"
    class="hero"
  >

    <div class="message">
      Loading team...
    </div>

  </div>

  <div
    id="stats"
    class="stats"
  ></div>

  <section class="section">

    <div class="section-title">
      Recent matches
    </div>

    <div
      id="recent"
      class="matches"
    ></div>

  </section>

  <section class="section">

    <div class="section-title">
      Upcoming fixtures
    </div>

    <div
      id="upcoming"
      class="matches"
    ></div>

  </section>

  <section class="section">

    <div class="section-title">
      Top scorers
    </div>

    <div class="table-panel">

      <table>

        <thead>
          <tr>
            <th>Player</th>
            <th>Goals</th>
            <th>Assists</th>
          </tr>
        </thead>

        <tbody id="scorers"></tbody>

      </table>

    </div>

  </section>

</main>

<script>

const API_BASE = "";

const params =
  new URLSearchParams(
    window.location.search
  );

const teamId =
  params.get("teamId");

const league =
  params.get("league") ||
  "premier";

const q =
  selector =>
    document.querySelector(
      selector
    );

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function fetchApi(
  endpoint
) {

  const response =
    await fetch(
      API_BASE + endpoint,
      {
        cache: "no-store"
      }
    );

  let data = {};

  try {
    data =
      await response.json();
  } catch (_) {}

  if (!response.ok) {

    throw new Error(
      data?.error ||
      `HTTP ${response.status}`
    );
  }

  return data;
}

function crest(team) {

  if (!team?.crest) {
    return "";
  }

  return `
    <img
      src="${escapeHtml(
        team.crest
      )}"
      alt=""
      onerror="this.style.display='none'"
    >
  `;
}

function teamName(team) {

  return (
    team?.name ||
    team?.shortName ||
    "Unknown team"
  );
}

function formatDate(
  value
) {

  if (!value) {
    return "";
  }

  return new Date(
    value
  ).toLocaleDateString(
    "en-AU",
    {
      day: "numeric",
      month: "short"
    }
  );
}

function formatTime(
  value
) {

  if (!value) {
    return "";
  }

  return new Date(
    value
  ).toLocaleTimeString(
    "en-AU",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

/*
  ----------------------------------------------------------
  TEAM
  ----------------------------------------------------------
*/

async function loadTeam() {

  if (!teamId) {

    q("#team-hero")
      .innerHTML = `
        <div class="message error">
          No team was selected.
        </div>
      `;

    return;
  }

  const data =
    await fetchApi(
      `/api/team?teamId=${encodeURIComponent(
        teamId
      )}`
    );

  const team =
    data.team;

  document.title =
    `SCOREdash — ${teamName(team)}`;

  q("#team-hero")
    .innerHTML = `

      ${crest(team)}

      <div>

        <div class="hero-name">
          ${escapeHtml(
            teamName(team)
          )}
        </div>

        <div class="hero-meta">

          ${
            team.area?.name
              ? escapeHtml(
                  team.area.name
                )
              : ""
          }

          ${
            team.venue
              ? ` · ${escapeHtml(
                  team.venue
                )}`
              : ""
          }

        </div>

      </div>

    `;
}

/*
  ----------------------------------------------------------
  TEAM MATCHES
  ----------------------------------------------------------
*/

async function loadTeamMatches() {

  const data =
    await fetchApi(
      `/api/team-matches?teamId=${encodeURIComponent(
        teamId
      )}&league=${encodeURIComponent(
        league
      )}`
    );

  const matches =
    Array.isArray(
      data.matches
    )
      ? data.matches
      : [];

  const finished =
    matches
      .filter(
        match =>
          match.status ===
          "FINISHED"
      )
      .sort(
        (a, b) =>
          new Date(b.utcDate) -
          new Date(a.utcDate)
      );

  const upcoming =
    matches
      .filter(
        match =>
          match.status !==
          "FINISHED"
      )
      .sort(
        (a, b) =>
          new Date(a.utcDate) -
          new Date(b.utcDate)
      );

  renderMatchList(
    finished.slice(0, 10),
    "#recent"
  );

  renderMatchList(
    upcoming.slice(0, 10),
    "#upcoming"
  );

  calculateStats(
    finished
  );
}

function renderMatchList(
  matches,
  selector
) {

  const container =
    q(selector);

  if (
    !matches.length
  ) {

    container.innerHTML = `
      <div class="message">
        No matches available.
      </div>
    `;

    return;
  }

  container.innerHTML =
    matches
      .map(
        match => `

          <div class="match">

            <div class="match-grid">

              <div class="team">

                ${crest(
                  match.homeTeam
                )}

                <span class="team-name">
                  ${escapeHtml(
                    teamName(
                      match.homeTeam
                    )
                  )}
                </span>

              </div>

              <div>

                <div class="score">

                  ${
                    match.status ===
                    "FINISHED"
                      ? `${escapeHtml(
                          match.score
                            ?.fullTime
                            ?.home ??
                            "-"
                        )} - ${escapeHtml(
                          match.score
                            ?.fullTime
                            ?.away ??
                            "-"
                        )}`
                      : "-"
                  }

                </div>

                <div class="time">

                  ${
                    match.status ===
                    "FINISHED"
                      ? "FT"
                      : `${formatDate(
                          match.utcDate
                        )} ${formatTime(
                          match.utcDate
                        )}`
                  }

                </div>

              </div>

              <div class="team away">

                <span class="team-name">
                  ${escapeHtml(
                    teamName(
                      match.awayTeam
                    )
                  )}
                </span>

                ${crest(
                  match.awayTeam
                )}

              </div>

            </div>

          </div>

        `
      )
      .join("");
}

/*
  ----------------------------------------------------------
  TEAM STATS
  ----------------------------------------------------------
*/

function calculateStats(
  finished
) {

  let played = 0;
  let wins = 0;
  let draws = 0;
  let losses = 0;
  let goalsFor = 0;
  let goalsAgainst = 0;

  for (
    const match of finished
  ) {

    const isHome =
      Number(
        match.homeTeam?.id
      ) === Number(teamId);

    const homeGoals =
      Number(
        match.score?.fullTime?.home
      );

    const awayGoals =
      Number(
        match.score?.fullTime?.away
      );

    if (
      Number.isNaN(homeGoals) ||
      Number.isNaN(awayGoals)
    ) {
      continue;
    }

    played++;

    if (isHome) {

      goalsFor +=
        homeGoals;

      goalsAgainst +=
        awayGoals;

      if (
        homeGoals >
        awayGoals
      ) {
        wins++;
      } else if (
        homeGoals ===
        awayGoals
      ) {
        draws++;
      } else {
        losses++;
      }

    } else {

      goalsFor +=
        awayGoals;

      goalsAgainst +=
        homeGoals;

      if (
        awayGoals >
        homeGoals
      ) {
        wins++;
      } else if (
        awayGoals ===
        homeGoals
      ) {
        draws++;
      } else {
        losses++;
      }
    }
  }

  q("#stats")
    .innerHTML = `

      <div class="stat">
        <div class="stat-number">
          ${played}
        </div>
        <div class="stat-label">
          Played
        </div>
      </div>

      <div class="stat">
        <div class="stat-number">
          ${wins}
        </div>
        <div class="stat-label">
          Wins
        </div>
      </div>

      <div class="stat">
        <div class="stat-number">
          ${draws}
        </div>
        <div class="stat-label">
          Draws
        </div>
      </div>

      <div class="stat">
        <div class="stat-number">
          ${losses}
        </div>
        <div class="stat-label">
          Losses
        </div>
      </div>

    `;
}

/*
  ----------------------------------------------------------
  SCORERS
  ----------------------------------------------------------
*/

async function loadScorers() {

  const container =
    q("#scorers");

  try {

    const data =
      await fetchApi(
        `/api/team-scorers?teamId=${encodeURIComponent(
          teamId
        )}&league=${encodeURIComponent(
          league
        )}`
      );

    const scorers =
      Array.isArray(
        data.scorers
      )
        ? data.scorers
        : [];

    if (
      scorers.length === 0
    ) {

      container.innerHTML = `
        <tr>
          <td colspan="3">
            No scorer data available.
          </td>
        </tr>
      `;

      return;
    }

    container.innerHTML =
      scorers
        .sort(
          (a, b) =>
            Number(
              b.goals || 0
            ) -
            Number(
              a.goals || 0
            )
        )
        .map(
          scorer => `

            <tr>

              <td class="player">
                ${escapeHtml(
                  scorer.player?.name ||
                  "Unknown player"
                )}
              </td>

              <td>
                ${escapeHtml(
                  scorer.goals ||
                  0
                )}
              </td>

              <td>
                ${escapeHtml(
                  scorer.assists ||
                  0
                )}
              </td>

            </tr>

          `
        )
        .join("");

  } catch (error) {

    container.innerHTML = `
      <tr>
        <td colspan="3">
          ${escapeHtml(
            error.message
          )}
        </td>
      </tr>
    `;
  }
}

/*
  ----------------------------------------------------------
  START
  ----------------------------------------------------------
*/

async function start() {

  if (!teamId) {
    return;
  }

  try {

    await loadTeam();

    await Promise.all([
      loadTeamMatches(),
      loadScorers()
    ]);

  } catch (error) {

    q("#team-hero")
      .innerHTML = `
        <div class="message error">
          ${escapeHtml(
            error.message
          )}
        </div>
      `;
  }
}

start();

</script>

</body>
</html>
