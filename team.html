<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>SCOREdash — Team</title>

<style>

:root{
  --accent:#c9ff4a;
  --bg:#070b14;
  --panel:#101728;
  --line:#ffffff12;
  --muted:#aeb6cc;
  --muted2:#7f89a4;
}

*{
  box-sizing:border-box
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at 50% -10%,
      #ffffff0b,
      transparent 40%
    ),
    linear-gradient(
      180deg,
      #070b14,
      #050812
    );

  color:#fff;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  min-height:100vh;
}

a{
  color:inherit
}

.top{
  height:3px;
  background:var(--accent);
}

.wrap{
  width:min(
    1120px,
    calc(100% - 28px)
  );

  margin:0 auto;
}

header{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  padding:
    25px 0 18px;
}

.logo{
  color:inherit;

  text-decoration:none;

  font-weight:900;

  letter-spacing:-.06em;

  font-size:25px;
}

.logo b{
  color:var(--accent)
}

.logo-sub{
  color:var(--muted2);

  font-size:9px;

  letter-spacing:.12em;

  text-transform:uppercase;

  margin-top:2px;
}

.back{
  text-decoration:none;

  color:var(--muted);

  border:
    1px solid
    var(--line);

  background:#ffffff05;

  border-radius:999px;

  padding:
    9px 13px;

  font:
    700 9px
    "DM Mono",
    monospace;

  text-transform:uppercase;

  letter-spacing:.08em;
}

.hero{
  border:
    1px solid
    var(--line);

  background:
    radial-gradient(
      circle at 50% 0%,
      #ffffff0b,
      transparent 55%
    ),
    linear-gradient(
      180deg,
      #111a2d,
      #0c1322
    );

  border-radius:18px;

  padding:
    30px 24px 24px;

  box-shadow:
    0 18px 55px
    #00000030;
}

.hero-main{
  display:grid;

  grid-template-columns:
    130px 1fr;

  gap:25px;

  align-items:center;
}

.hero-crest{
  width:105px;
  height:105px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 10px 18px
      #00000040
    );
}

.kicker{
  color:var(--accent);

  font:
    700 9px
    "DM Mono",
    monospace;

  letter-spacing:.12em;

  text-transform:uppercase;
}

h1{
  margin:
    6px 0 5px;

  font-size:
    clamp(
      30px,
      5vw,
      50px
    );

  letter-spacing:-.055em;
}

.meta{
  color:var(--muted2);

  font-size:11px;
}

.stats{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:10px;

  margin-top:24px;
}

.stat{
  padding:15px;

  border:
    1px solid
    var(--line);

  background:#ffffff04;

  border-radius:11px;
}

.stat-label{
  color:var(--muted2);

  font:
    700 8px
    "DM Mono",
    monospace;

  text-transform:uppercase;

  letter-spacing:.08em;
}

.stat-value{
  margin-top:6px;

  font-size:22px;

  font-weight:850;
}

.form{
  display:flex;

  gap:6px;

  margin-top:13px;
}

.form-dot{
  width:28px;
  height:28px;

  display:grid;

  place-items:center;

  border-radius:8px;

  font:
    800 9px
    "DM Mono",
    monospace;

  background:#ffffff0a;

  border:
    1px solid
    var(--line);
}

.form-W{
  color:#c9ff4a
}

.form-D{
  color:#ffd15c
}

.form-L{
  color:#ff6d7e
}

.grid{
  display:grid;

  grid-template-columns:
    1.25fr .75fr;

  gap:14px;

  margin-top:14px;
}

.panel{
  border:
    1px solid
    var(--line);

  background:
    linear-gradient(
      180deg,
      #101728,
      #0c1322
    );

  border-radius:15px;

  padding:19px;
}

.panel-title{
  font:
    800 10px
    "DM Mono",
    monospace;

  letter-spacing:.1em;

  text-transform:uppercase;

  color:#fff;

  margin-bottom:13px;
}

.match{
  display:grid;

  grid-template-columns:
    1fr 64px 1fr;

  gap:10px;

  align-items:center;

  padding:13px 0;

  border-bottom:
    1px solid
    var(--line);
}

.match:last-child{
  border-bottom:0
}

.match-team{
  display:flex;

  align-items:center;

  gap:9px;

  min-width:0;

  font-size:10px;

  font-weight:750;

  text-align:left;

  justify-content:flex-start;
}

.match-team.right{
  justify-content:flex-end;

  text-align:right;
}

.match-team span{
  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.mini-crest{
  width:25px;
  height:25px;

  object-fit:contain;

  flex:none;
}

.match-score{
  text-align:center;

  font:
    800 13px
    "DM Mono",
    monospace;
}

.match-date{
  color:var(--muted2);

  font:
    600 8px
    "DM Mono",
    monospace;

  text-align:center;

  margin-top:3px;
}

.result-W .match-score{
  color:#c9ff4a
}

.result-D .match-score{
  color:#ffd15c
}

.result-L .match-score{
  color:#ff6d7e
}

.scorer{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:12px 0;

  border-bottom:
    1px solid
    var(--line);
}

.scorer:last-child{
  border-bottom:0
}

.player-name{
  font-size:10px;

  font-weight:800;
}

.player-team{
  font-size:8px;

  color:var(--muted2);

  margin-top:3px;
}

.goals{
  color:var(--accent);

  font:
    800 13px
    "DM Mono",
    monospace;
}

.empty{
  padding:
    20px 5px;

  text-align:center;

  color:var(--muted2);

  font-size:10px;
}

.loading{
  opacity:.7
}

.error{
  color:#ff7c8d;
}

@media(max-width:760px){

  .hero-main{
    grid-template-columns:
      80px 1fr;

    gap:16px;
  }

  .hero-crest{
    width:72px;
    height:72px;
  }

  .stats{
    grid-template-columns:
      repeat(3,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:460px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .hero{
    padding:
      22px 16px;
  }

}

</style>

</head>

<body>

<div class="top"></div>

<div class="wrap">

<header>

  <div>

    <a
      class="logo"
      href="index.html"
    >
      SCORE<b>DASH</b>
    </a>

    <div class="logo-sub">
      Football scores & fixtures
    </div>

  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Back to scores
  </a>

</header>


<main>

<section class="hero">

  <div
    id="hero"
    class="loading"
  >
    Loading team…
  </div>

</section>


<div class="grid">


<section class="panel">

  <div class="panel-title">
    Recent & upcoming matches
  </div>

  <div id="matches">

    <div class="empty">
      Loading matches…
    </div>

  </div>

</section>


<section class="panel">

  <div class="panel-title">
    Top scorers
  </div>

  <div id="scorers">

    <div class="empty">
      Loading scorers…
    </div>

  </div>

</section>


</div>

</main>

</div>


<script>

const params =
  new URLSearchParams(
    location.search
  );


const teamId =
  params.get(
    "teamId"
  );


const league =
  params.get(
    "league"
  ) ||
  "";


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


async function fetchApi(
  endpoint
){

  const response =
    await fetch(
      endpoint,
      {
        cache:
          "no-store"
      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        text
      );

  }

  catch{

    throw new Error(
      "The server returned invalid data."
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data?.message ||
      data?.error ||
      `HTTP ${response.status}`
    );

  }


  return data;

}


function dateText(
  value
){

  if(!value){
    return "";
  }


  const date =
    new Date(
      value
    );


  return date.toLocaleDateString(
    "en-AU",
    {
      day:
        "numeric",

      month:
        "short"
    }
  );

}


function miniCrest(
  url
){

  if(!url){
    return "";
  }


  return `

    <img
      class="mini-crest"
      src="${escapeHtml(url)}"
      alt=""
      onerror="this.style.display='none'"
    >

  `;

}


function formatScore(
  match
){

  const h =
    match?.score?.fullTime?.home;


  const a =
    match?.score?.fullTime?.away;


  if(
    typeof h !==
      "number" ||

    typeof a !==
      "number"
  ){

    return "—";

  }


  return `${h} — ${a}`;

}


/* =========================================================
   RESULT
   ========================================================= */

function resultFor(
  match
){

  const h =
    match?.score?.fullTime?.home;


  const a =
    match?.score?.fullTime?.away;


  if(
    typeof h !==
      "number" ||

    typeof a !==
      "number"
  ){

    return "";

  }


  const isHome =
    String(
      match?.homeTeam?.id
    ) ===
    String(
      teamId
    );


  if(
    h === a
  ){

    return "D";

  }


  return (
    isHome
      ? h > a
      : a > h
  )
    ? "W"
    : "L";

}


/* =========================================================
   HERO
   ========================================================= */

function renderHero(
  team,
  matches
){

  const finished =
    matches
      .filter(
        match =>
          match.status ===
          "FINISHED"
      );


  const recent =
    finished
      .slice()
      .sort(
        (a,b) =>
          new Date(
            b.utcDate
          ) -
          new Date(
            a.utcDate
          )
      );


  let wins = 0;

  let draws = 0;

  let losses = 0;

  let goalsFor = 0;

  let goalsAgainst = 0;


  for(
    const match of
      finished
  ){

    const h =
      match?.score?.fullTime?.home;


    const a =
      match?.score?.fullTime?.away;


    if(
      typeof h !==
        "number" ||

      typeof a !==
        "number"
    ){

      continue;

    }


    const isHome =
      String(
        match?.homeTeam?.id
      ) ===
      String(
        teamId
      );


    const gf =
      isHome
        ? h
        : a;


    const ga =
      isHome
        ? a
        : h;


    goalsFor +=
      gf;


    goalsAgainst +=
      ga;


    if(
      gf > ga
    ){

      wins++;

    }

    else if(
      gf === ga
    ){

      draws++;

    }

    else{

      losses++;

    }

  }


  const form =
    recent
      .slice(
        0,
        5
      )
      .reverse();


  const formHtml =
    form.length

      ? form
          .map(
            match => {

              const result =
                resultFor(
                  match
                );


              return `

                <span
                  class="
                    form-dot
                    form-${result}
                  "
                >
                  ${result}
                </span>

              `;

            }
          )
          .join("")

      : `

          <span class="meta">
            No completed matches yet
          </span>

        `;


  const goalDifference =
    goalsFor -
    goalsAgainst;


  document
    .getElementById(
      "hero"
    )
    .classList
    .remove(
      "loading"
    );


  document
    .getElementById(
      "hero"
    )
    .innerHTML = `

      <div class="hero-main">

        <div>

          ${
            team?.crest
              ? `

                <img
                  class="hero-crest"
                  src="${escapeHtml(
                    team.crest
                  )}"
                  alt=""
                  onerror="this.style.display='none'"
                >

              `
              : ""
          }

        </div>


        <div>

          <div class="kicker">
            Football Team
          </div>


          <h1>

            ${escapeHtml(
              team?.name ||
              team?.shortName ||
              "Team"
            )}

          </h1>


          <div class="meta">

            ${
              team?.venue
                ? escapeHtml(
                    team.venue
                  )
                : ""
            }

            ${
              team?.founded
                ? ` · Founded ${escapeHtml(
                    team.founded
                  )}`
                : ""
            }

          </div>


          <div class="form">

            ${formHtml}

          </div>

        </div>

      </div>


      <div class="stats">


        <div class="stat">

          <div class="stat-label">
            Played
          </div>

          <div class="stat-value">
            ${finished.length}
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Wins
          </div>

          <div class="stat-value">
            ${wins}
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Draws
          </div>

          <div class="stat-value">
            ${draws}
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Losses
          </div>

          <div class="stat-value">
            ${losses}
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Goal diff
          </div>

          <div class="stat-value">

            ${
              goalDifference > 0
                ? "+" +
                  goalDifference
                : goalDifference
            }

          </div>

        </div>


      </div>

    `;

}


/* =========================================================
   MATCHES
   ========================================================= */

function renderMatches(
  matches
){

  const container =
    document.getElementById(
      "matches"
    );


  const sorted =
    matches
      .slice()
      .sort(
        (a,b) =>
          new Date(
            b.utcDate
          ) -
          new Date(
            a.utcDate
          )
      );


  if(
    !sorted.length
  ){

    container.innerHTML = `

      <div class="empty">
        No matches available.
      </div>

    `;

    return;

  }


  container.innerHTML =
    sorted
      .slice(0,20)
      .map(
        match => {

          const result =
            match.status ===
            "FINISHED"
              ? resultFor(
                  match
                )
              : "";


          const home =
            match.homeTeam ||
            {};


          const away =
            match.awayTeam ||
            {};


          return `

            <div
              class="
                match
                ${
                  result
                    ? `result-${result}`
                    : ""
                }
              "
            >

              <div
                class="match-team"
              >

                ${miniCrest(
                  home.crest
                )}

                <span>
                  ${escapeHtml(
                    home.shortName ||
                    home.name ||
                    ""
                  )}
                </span>

              </div>


              <div>

                <div
                  class="match-score"
                >

                  ${escapeHtml(
                    match.status ===
                      "FINISHED"
                      ? formatScore(
                          match
                        )
                      : "—"
                  )}

                </div>


                <div
                  class="match-date"
                >

                  ${escapeHtml(
                    dateText(
                      match.utcDate
                    )
                  )}

                </div>

              </div>


              <div
                class="
                  match-team
                  right
                "
              >

                <span>

                  ${escapeHtml(
                    away.shortName ||
                    away.name ||
                    ""
                  )}

                </span>


                ${miniCrest(
                  away.crest
                )}

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   SCORERS
   ========================================================= */

function renderScorers(
  scorers
){

  const container =
    document.getElementById(
      "scorers"
    );


  if(
    !scorers.length
  ){

    container.innerHTML = `

      <div class="empty">

        No scorer data is available
        for this team.

      </div>

    `;

    return;

  }


  const sorted =
    scorers
      .slice()
      .sort(
        (a,b) =>
          Number(
            b?.goals ||
            0
          ) -
          Number(
            a?.goals ||
            0
          )
      );


  container.innerHTML =
    sorted
      .slice(
        0,
        10
      )
      .map(
        item => `

          <div
            class="scorer"
          >

            <div>

              <div
                class="player-name"
              >

                ${escapeHtml(
                  item?.player?.name ||
                  "Unknown player"
                )}

              </div>

              <div
                class="player-team"
              >

                ${escapeHtml(
                  item?.team?.shortName ||
                  item?.team?.name ||
                  ""
                )}

              </div>

            </div>


            <div class="goals">

              ${escapeHtml(
                item?.goals ||
                0
              )}

              ⚽

            </div>

          </div>

        `
      )
      .join("");

}


/* =========================================================
   LOAD
   ========================================================= */

async function load(){

  if(
    !teamId
  ){

    document.getElementById(
      "hero"
    ).innerHTML = `

      <div class="empty error">
        No team was selected.
      </div>

    `;

    return;

  }


  try{

    const [
      team,
      matchesData,
      scorersData
    ] =
      await Promise.all([

        fetchApi(
          `/api/team?teamId=${encodeURIComponent(
            teamId
          )}`
        ),

        fetchApi(
          `/api/team-matches?teamId=${encodeURIComponent(
            teamId
          )}&league=${encodeURIComponent(
            league
          )}`
        ),

        fetchApi(
          `/api/team-scorers?teamId=${encodeURIComponent(
            teamId
          )}&league=${encodeURIComponent(
            league
          )}`
        )

      ]);


    document.title =
      `SCOREdash — ${
        team?.shortName ||
        team?.name ||
        "Team"
      }`;


    const matches =
      Array.isArray(
        matchesData?.matches
      )
        ? matchesData.matches
        : [];


    const scorers =
      Array.isArray(
        scorersData?.scorers
      )
        ? scorersData.scorers
        : [];


    renderHero(
      team,
      matches
    );


    renderMatches(
      matches
    );


    renderScorers(
      scorers
    );

  }

  catch(error){

    console.error(
      error
    );


    document.getElementById(
      "hero"
    ).classList.remove(
      "loading"
    );


    document.getElementById(
      "hero"
    ).innerHTML = `

      <div class="empty error">

        Unable to load the team.

        <br><br>

        ${escapeHtml(
          error?.message ||
          "Team information is unavailable."
        )}

      </div>

    `;

  }

}


load();

</script>

</body>

</html>
